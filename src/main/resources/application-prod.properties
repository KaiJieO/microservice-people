# Production Configuration
# Usage: ./gradlew bootRun --args='--spring.profiles.active=prod'

# Application
spring.application.name=microservice-people
server.port=8081

# MySQL (production instance)
spring.datasource.url=jdbc:mysql://localhost:3306/microservice_people_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=test123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate (validate only, no DDL generation)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway (enabled in production for versioned migrations)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# SQL initialization (disabled, use Flyway instead)
spring.sql.init.mode=never

# Redis (production instance)
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=2000

# Caching (Redis backend)
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.use-key-prefix=true

# Logging
logging.level.com.microservice.people=INFO
